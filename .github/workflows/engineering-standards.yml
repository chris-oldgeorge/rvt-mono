name: Engineering standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Required-check-safe paths filter: docs-only changes skip the standards
  # job via `if:` gating, and the skipped job still satisfies a required
  # check. The changed-range standards scan ignores markdown anyway.
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/detect-code-changes.sh --base "${BASE_SHA}" --head "${GITHUB_SHA}"

  engineering-standards:
    name: Engineering standards
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up monorepo toolchain
        uses: ./.github/actions/setup-monorepo

      - name: Verify standards model and module policy
        run: node --test tests/engineering-standards-model.test.mjs tests/verify-engineering-standards-policy.test.mjs

      - name: Verify engineering configuration
        run: tests/verify-engineering-configuration.test.sh

      - name: Verify shell conditional safety
        run: |
          tests/verify-shell-conditionals.test.sh
          scripts/verify-shell-conditionals.sh .

      - name: Verify automatic workflow contract
        run: tests/verify-engineering-standards-workflow.test.sh

      - name: Verify changed-range engineering standards
        run: scripts/verify-engineering-standards.sh --base auto --head HEAD
