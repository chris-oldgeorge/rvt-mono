name: SonarQube

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, linux, ARM64, rvt-sonar]
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 17
          distribution: zulu

      - name: Set up .NET 10
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/portal/RvtPortal.Client/package-lock.json

      - name: Install Portal client dependencies
        working-directory: apps/portal/RvtPortal.Client
        run: npm ci --ignore-scripts

      - name: Prepare integration database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          database_name="rvt_sonar_${{ github.run_id }}_${{ github.run_attempt }}"
          until pg_isready -h rvt-sonar-db -U postgres -d postgres; do
            sleep 2
          done
          psql -h rvt-sonar-db -U postgres -d postgres -v ON_ERROR_STOP=1 -v database_name="${database_name}" <<'SQL'
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = :'database_name' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS :"database_name";
          CREATE DATABASE :"database_name";
          SQL
          psql -h rvt-sonar-db -U postgres -d "${database_name}" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          SQL
          {
            echo "RVT_TEST_POSTGRES_CONNECTION=Host=rvt-sonar-db;Port=5432;Database=${database_name};Username=postgres;Password=postgres"
            echo "RVT__POSTGRES_INTEGRATION_CONNECTION=Host=rvt-sonar-db;Port=5432;Database=${database_name};Username=postgres;Password=postgres"
            echo "RVT_EF_CONNECTION=Host=rvt-sonar-db;Port=5432;Database=${database_name};Username=postgres;Password=postgres"
            echo "RVT_DEPLOY_CONNECTION=Host=rvt-sonar-db;Port=5432;Database=${database_name};Username=postgres;Password=postgres"
          } >>"${GITHUB_ENV}"

      - name: Install analysis tools
        run: |
          dotnet tool install dotnet-sonarscanner --tool-path .sonar --version 11.2.1
          dotnet tool install dotnet-coverage --tool-path .sonar --version 18.9.0
          dotnet tool install dotnet-ef --tool-path .sonar --version 10.0.10

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          ./.sonar/dotnet-sonarscanner begin \
            /k:aileron-forward_rvt-mono \
            /o:aileron-forward \
            /d:sonar.host.url=https://sonarcloud.io \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.vscoveragexml.reportsPaths=artifacts/coverage/coverage.xml \
            /d:sonar.javascript.lcov.reportPaths=apps/portal/RvtPortal.Client/coverage/lcov.info \
            /d:sonar.scanner.scanAll=true \
            '/d:sonar.cpd.exclusions=apps/portal/database/**,apps/portal/RVT.DataAccess/Migrations/**,apps/portal/RVT.DataAccess/EntityModels/Models/**,apps/portal/RvtPortal.Client/dist/**,apps/portal/RvtPortal.Client/coverage/**,apps/portal/RvtPortal.Client/src/api/schema.d.ts,**/bin/**,**/obj/**' \
            '/d:sonar.coverage.exclusions=apps/portal/database/**,apps/portal/RVT.DataAccess/Migrations/**,apps/portal/RVT.DataAccess/EntityModels/Models/**,apps/portal/RvtPortal.Client/dist/**,apps/portal/RvtPortal.Client/coverage/**,apps/portal/RvtPortal.Client/src/api/schema.d.ts,**/bin/**,**/obj/**' \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=600

      - name: Restore monorepo
        run: dotnet restore Rvt.Mono.slnx --locked-mode --disable-parallel

      - name: Verify engineering standards
        run: scripts/verify-engineering-standards.sh --base auto --head HEAD

      - name: Build monorepo (Release)
        run: dotnet build Rvt.Mono.slnx --configuration Release --no-restore --no-incremental --nologo -m:1

      - name: Deploy Portal database
        run: |
          set -euo pipefail
          ./.sonar/dotnet-ef database update --no-build --configuration Release \
            --context RVTDbContext \
            --project apps/portal/RVT.DataAccess/RVT.DataAccess.csproj \
            --startup-project apps/portal/RVT.DataAccess/RVT.DataAccess.csproj
          ./.sonar/dotnet-ef database update --no-build --configuration Release \
            --context RVTSearchContext \
            --project apps/portal/RVT.DataAccess/RVT.DataAccess.csproj \
            --startup-project apps/portal/RVT.DataAccess/RVT.DataAccess.csproj
          ./.sonar/dotnet-ef database update --no-build --configuration Release \
            --context ApplicationDbContext \
            --project apps/portal/RvtPortal.Spa/RvtPortal.Spa.csproj \
            --startup-project apps/portal/RvtPortal.Spa/RvtPortal.Spa.csproj
          dotnet run --project apps/portal/RVT.SchemaDeploy/RVT.SchemaDeploy.csproj \
            --configuration Release --no-build -- \
            --connection "${RVT_DEPLOY_CONNECTION}"

      - name: Collect .NET coverage
        run: |
          mkdir -p artifacts/coverage
          ./.sonar/dotnet-coverage collect \
            "dotnet test Rvt.Mono.slnx --configuration Release --no-build --no-restore --nologo -m:1" \
            -f xml \
            -o artifacts/coverage/coverage.xml
          test -s artifacts/coverage/coverage.xml

      - name: Collect Portal client coverage
        working-directory: apps/portal/RvtPortal.Client
        run: |
          npm run test:coverage
          test -s coverage/lcov.info

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Drop integration database
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          database_name="rvt_sonar_${{ github.run_id }}_${{ github.run_attempt }}"
          until pg_isready -h rvt-sonar-db -U postgres -d postgres; do
            sleep 2
          done
          psql -h rvt-sonar-db -U postgres -d postgres -v ON_ERROR_STOP=1 -v database_name="${database_name}" <<'SQL'
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = :'database_name' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS :"database_name";
          SQL
