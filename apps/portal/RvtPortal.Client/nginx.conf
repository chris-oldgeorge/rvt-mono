server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. add_header is inherited only while a location adds none of its own,
    # so these stay at server level and the locations below stay header-free.
    #
    # The bundle ships no inline script or style: Vite emits a module <script src> plus a
    # <link rel=stylesheet>, and React, Leaflet and Chart.js apply element styles through
    # the CSSOM, which CSP does not govern. script-src and style-src therefore stay 'self'.
    # img-src allows any https origin because monitor pictures and site customer logos are
    # served from object storage and the map tiles come from tile.openstreetmap.org.
    # connect-src allows https for the same reason the client exposes
    # VITE_RVT_PORTAL_API_URL: the API may be deployed on its own origin, which is a
    # build-time value this file cannot see. Pin it once that origin is fixed per environment.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
