name: common-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/rvt-monitor-common
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rvt_common_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rvt_common_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      RVT__POSTGRES_INTEGRATION_CONNECTION: Host=127.0.0.1;Port=5432;Database=rvt_common_ci;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore rvt-common.sln --locked-mode
      - name: Reject vulnerable dependencies
        shell: bash
        run: |
          output="$(dotnet list rvt-common.sln package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          ! grep -q 'has the following vulnerable packages' <<<"$output"
      - run: dotnet format whitespace rvt-common.sln --verify-no-changes --no-restore
      - run: dotnet build rvt-common.sln -c Release --no-restore --nologo
      - run: dotnet test rvt-common.sln -c Release --no-build --nologo
